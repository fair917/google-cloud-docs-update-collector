[project]
name = "gcdocs-collector"
version = "0.1.0"
description = "Detect additions and updates of Google Cloud docs via sitemap.xml"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=2.18.0",
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "PyYAML>=6.0.2",
]

[project.scripts]
gcdocs-collector = "collector.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collector = ["py.typed"]
